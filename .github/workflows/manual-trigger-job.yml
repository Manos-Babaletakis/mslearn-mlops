name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install latest Azure ML CLI extension
        run: |
          az extension remove -n azure-cli-ml || true
          az extension remove -n ml || true
          az extension add -n ml -y
          az extension update -n ml
          az version
          az extension show -n ml

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Azure context
        run: |
          az account show --query "{subscription:id, tenant:tenantId, identity:user}" -o json

      - name: Run Azure Machine Learning training job
        run: az ml job create -f src/job.yml --stream --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }}
